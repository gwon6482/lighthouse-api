<title>진로계획 라이브러리</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 왼쪽 직업 목록 + 오른쪽 상세(진로설계 탭) / 필터 줄 + 카드 목록(보편 프로젝트 탭). 라이트하우스 노랑은 강조 한 곳에만 */
:root {
  --bg: #f7f7f4;
  --surface: #ffffff;
  --surface-2: #f0efe9;
  --line: #e2e0d7;
  --fg: #1d1c18;
  --fg-2: #5d5b52;
  --fg-3: #8d8a7e;
  --accent: #f5c400;
  --accent-ink: #4a3b00;
  --accent-soft: #fff4c2;
  --common: #2f6fdb;
  --common-soft: #e6eefc;
  --local: #6b5d3a;
  --local-soft: #f1ecdf;
  --warn: #b4540a;
  --warn-soft: #fdeedd;
  --c-qualification: #c2410c;
  --c-knowledge: #2563eb;
  --c-skill: #0f8a5f;
  --c-portfolio: #9333ea;
  --c-experience: #b45309;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15140f; --surface: #1e1d17; --surface-2: #26251e; --line: #36342b; --fg: #efede4; --fg-2: #b7b4a6; --fg-3: #858273;
  --accent: #f5c400; --accent-ink: #1d1700; --accent-soft: #3a3105; --common: #7aa7f5; --common-soft: #1c2a45; --local: #d4c49a; --local-soft: #302b1d;
  --warn: #f0a35c; --warn-soft: #3a2614;
  --c-qualification: #fb8a5c; --c-knowledge: #7aa7f5; --c-skill: #4fd1a0; --c-portfolio: #c49af5; --c-experience: #f0b35c;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #15140f; --surface: #1e1d17; --surface-2: #26251e; --line: #36342b; --fg: #efede4; --fg-2: #b7b4a6; --fg-3: #858273;
  --accent: #f5c400; --accent-ink: #1d1700; --accent-soft: #3a3105; --common: #7aa7f5; --common-soft: #1c2a45; --local: #d4c49a; --local-soft: #302b1d;
  --warn: #f0a35c; --warn-soft: #3a2614;
  --c-qualification: #fb8a5c; --c-knowledge: #7aa7f5; --c-skill: #4fd1a0; --c-portfolio: #c49af5; --c-experience: #f0b35c;
  color-scheme: dark }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-size: 12px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top__row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; max-width: 1280px; margin: 0 auto; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand__mark { width: 12px; height: 26px; background: var(--accent); border-radius: 2px; }
.brand h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
.brand__draft { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; padding: 2px 7px; border-radius: 4px; background: var(--warn-soft); color: var(--warn); }
.tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 3px; border-radius: 8px; }
.tabs a { text-decoration: none; color: var(--fg-2); padding: 6px 14px; border-radius: 6px; font-weight: 600; font-size: 13px; }
.tabs a[aria-current="page"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.stats { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--fg-2); font-size: 12px; margin-left: auto; font-variant-numeric: tabular-nums; }
.stats b { color: var(--fg); font-weight: 600; }

.wrap { max-width: 1280px; margin: 0 auto; padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* 진로설계 */
.jobs { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 20px; align-items: start; }
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 70px); max-height: calc(100vh - 90px); display: flex; flex-direction: column; gap: 10px; }
.search { width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--fg); font: inherit; }
.side__list { overflow-y: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.fam { padding: 8px 12px 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; color: var(--fg-3); position: sticky; top: 0; background: var(--surface); }
.jobbtn { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; width: 100%; text-align: left; border: 0; background: none; padding: 7px 12px; cursor: pointer; border-left: 3px solid transparent; }
.jobbtn:hover { background: var(--surface-2); }
.jobbtn[aria-current="true"] { background: var(--accent-soft); border-left-color: var(--accent); }
.jobbtn__name { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.jobbtn__meta { font-size: 11px; color: var(--fg-3); grid-column: 1 / -1; }
.tier { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 4px; background: var(--surface-2); color: var(--fg-2); align-self: center; }
.tier--1 { background: var(--accent); color: var(--accent-ink); }
.stagebar { display: flex; flex-wrap: wrap; gap: 4px; }
.stagebar .fbtn { padding: 3px 9px; font-size: 12px; }

.detail { min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.head { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
.head__title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
.head h2 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.015em; text-wrap: balance; }
.head__official { color: var(--fg-2); }
.head p { margin: 0; max-width: 72ch; color: var(--fg-2); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--fg-2); white-space: nowrap; }
.gate { display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: 8px; background: var(--accent-soft); color: var(--fg); font-size: 13px; }
.gate b { white-space: nowrap; }
.verify { display: flex; gap: 8px; align-items: flex-start; padding: 8px 12px; border-radius: 8px; background: var(--warn-soft); color: var(--warn); font-size: 12.5px; }
.covers { font-size: 12.5px; color: var(--fg-2); }

.trackbar { display: flex; flex-wrap: wrap; gap: 6px; }
.trackbar button { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 999px; cursor: pointer; font-size: 13px; }
.trackbar button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.trackdesc { font-size: 12.5px; color: var(--fg-2); margin-top: -6px; }

.summary { display: flex; flex-wrap: wrap; gap: 10px; }
.sum { flex: 1 1 180px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; font-variant-numeric: tabular-nums; }
.sum__label { font-size: 11px; color: var(--fg-3); font-weight: 600; letter-spacing: 0.03em; }
.sum__val { font-size: 16px; font-weight: 700; }
.sum__val small { font-size: 12px; font-weight: 500; color: var(--fg-2); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--fg-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }

.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.step { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.step--opt { border-style: dashed; }
.step--skipmajor .step__name::after { content: ""; }
.step__head { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 4px 12px; align-items: start; padding: 12px 14px; width: 100%; text-align: left; border: 0; background: none; cursor: pointer; }
.step__no { font-family: var(--font-mono); font-size: 12px; color: var(--fg-3); padding-top: 2px; }
.step__main { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.step__name { font-weight: 600; font-size: 14.5px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.step__goal { color: var(--fg-2); font-size: 13px; }
.step__tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tag { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 4px; max-width: 100%; }  /* 줄보다 길면 잘리지 않고 꼬리표 안에서 줄바꿈 */
.tag--common { background: var(--common-soft); color: var(--common); }
.tag--local { background: var(--local-soft); color: var(--local); }
.tag--opt { background: var(--surface-2); color: var(--fg-2); }
.tag--skip { background: var(--surface-2); color: var(--fg-2); }
.tag--track { background: var(--accent-soft); color: var(--fg); }
.tag--cat { color: var(--surface); }
.step__weeks { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.step__weeks b { font-size: 15px; }
.step__weeks small { display: block; font-size: 11px; color: var(--fg-3); }
.step__note { font-size: 12.5px; color: var(--fg-2); }
.step__note em { font-style: normal; color: var(--fg-3); }
.step__body { border-top: 1px solid var(--line); padding: 12px 14px 14px 60px; display: flex; flex-direction: column; gap: 10px; background: var(--surface-2); }
.phases { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; }
.phase { background: var(--surface); border-radius: 8px; padding: 10px 12px; border: 1px solid var(--line); }
.phase__t { font-weight: 600; font-size: 13px; display: flex; justify-content: space-between; gap: 8px; }
.phase__t span { color: var(--fg-3); font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }
.phase ul { margin: 6px 0 0; padding-left: 16px; font-size: 12.5px; color: var(--fg-2); }
.meta { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--fg-2); }
.meta b { color: var(--fg); font-weight: 600; }
.jumplink { color: var(--common); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; background: none; border: 0; padding: 0; font-size: 12px; }

/* 보편 프로젝트 */
.filters { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.filters__row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.filters__label { font-size: 11px; font-weight: 600; color: var(--fg-3); width: 72px; flex: none; letter-spacing: 0.03em; }
.fbtn { border: 1px solid var(--line); background: var(--surface); padding: 4px 10px; border-radius: 999px; cursor: pointer; font-size: 12.5px; }
.fbtn[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.fbtn small { color: inherit; opacity: .65; margin-left: 3px; font-variant-numeric: tabular-nums; }
.cards { display: grid; align-items: start; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; }
.card__head { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border: 0; background: none; text-align: left; cursor: pointer; width: 100%; }
.card__top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.card__name { font-weight: 600; font-size: 14.5px; }
.card__use { font-size: 12px; color: var(--fg-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.card__use b { color: var(--fg); font-size: 15px; }
.card__goal { font-size: 13px; color: var(--fg-2); }
.card__body { border-top: 1px solid var(--line); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; background: var(--surface-2); border-radius: 0 0 10px 10px; }
.usedby { display: flex; flex-wrap: wrap; gap: 5px; }
.usedby button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 2px 9px; font-size: 12px; cursor: pointer; }
.usedby button:hover { border-color: var(--common); color: var(--common); }
.options { margin: 0; padding-left: 16px; font-size: 12.5px; color: var(--fg-2); }
.empty { padding: 40px; text-align: center; color: var(--fg-3); }
.sec-title { font-size: 12px; font-weight: 600; color: var(--fg-3); letter-spacing: 0.04em; margin: 0; }

@media (max-width: 820px) {
  .jobs { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; max-height: none; }
  .side__list { max-height: 260px; }
  .step__body { padding-left: 14px; }
  .stats { margin-left: 0; }
}
@media (prefers-reduced-motion: no-preference) { .jobbtn, .fbtn, .trackbar button { transition: background-color .12s; } }
</style>

<header class="top">
  <div class="top__row">
    <div class="brand"><span class="brand__mark" aria-hidden="true"></span><h1>진로계획 라이브러리</h1><span class="brand__draft">초안</span></div>
    <nav class="tabs" aria-label="보기">
      <a href="#jobs" id="tab-jobs">직업별 진로설계</a>
      <a href="#common" id="tab-common">보편 프로젝트</a>
    </nav>
    <div class="stats" id="stats"></div>
  </div>
</header>

<main class="wrap">
  <section id="view-jobs" class="jobs">
    <aside class="side">
      <input id="job-search" class="search" type="search" placeholder="직업 이름으로 찾기" aria-label="직업 찾기">
      <div class="stagebar" id="stage-bar" role="group" aria-label="만든 단계로 고르기"></div>
      <div class="side__list" id="job-list"></div>
    </aside>
    <div class="detail" id="job-detail"></div>
  </section>
  <section id="view-common" hidden>
    <div class="filters" id="filters"></div>
    <div class="cards" id="cards"></div>
  </section>
</main>

<script type="application/json" id="data">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const CAT = { qualification: '자격요건', knowledge: '분야지식', skill: '직무기술', portfolio: '포트폴리오', experience: '실무경험' };
const METHOD = { book: '책', lecture: '강의', academy: '학원·교육기관', study_group: '스터디', required_course: '필수 과목', school: '학교 수업', practice: '연습', personal_project: '개인 프로젝트', team_project: '팀 프로젝트', contest: '공모전', content: '콘텐츠', internship: '인턴', field_practice: '현장실습', parttime: '아르바이트·근무', club: '동아리', activity: '활동', etc: '기타' };
const TYPES = Object.fromEntries(D.taxonomy.types.map(t => [t.id, t]));
const FAM = D.taxonomy.families;
const SCOPE = { all: '전 직무 공통', family: '계열 공통', job: '직무 특화' };
const CP = Object.fromEntries(D.common.map(c => [c.id, c]));
const PRI = Object.fromEntries(D.priority.map(p => [p.jobCode, p]));
const PLANS = D.plans.slice().sort((a, b) => (PRI[a.jobCode].no - PRI[b.jobCode].no));
const PLAN = Object.fromEntries(PLANS.map(p => [p.jobCode, p]));
// 1차 = 우선순위 100개(tier 1~3), 그 뒤는 2차의 단계(wave 2~4)
const stageOf = pr => pr.tier != null ? '1' : String(pr.wave);
const STAGES = [['all', '전체'], ['1', '1차 100'], ['2', '2단계'], ['3', '3단계'], ['4', '4단계']];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const weeksOf = p => p.phases.reduce((s, ph) => s + ph.weeks, 0);
const fmtWeeks = w => w >= 52 ? `${w}주 <small>(약 ${Math.round(w / 4.345)}개월)</small>` : `${w}주`;

// 보편 프로젝트를 쓰는 직업
const USED = {};
for (const p of PLANS) {
  const refs = new Set([...p.common, ...Object.values(p.byTrack).flat()].map(i => i.ref).filter(r => r.startsWith('cp.')));
  for (const r of refs) (USED[r] ||= []).push(p.jobCode);
}

// 계열별 쓰임: USEDF[보편 id][계열] = 그 계열에서 쓰는 계획 수
const USEDF = {};
for (const [id, codes] of Object.entries(USED)) for (const code of codes) { const f = PLAN[code].family; (USEDF[id] ||= {})[f] = (USEDF[id][f] || 0) + 1; }
const BUNDLE = D.taxonomy.bundles || {};
const famLabel = (c, first) => {
  if (c.scope === 'all') return SCOPE.all;
  const fs = first && c.families.includes(first) ? [first, ...c.families.filter(f => f !== first)] : c.families;
  return fs.length > 3 ? `${fs.slice(0, 2).map(f => FAM[f]).join('·')} 외 ${fs.length - 2}계열` : fs.map(f => FAM[f]).join('·');
};
const inFam = (c, fam) => c.families.includes(fam) || !!USEDF[c.id]?.[fam] || (BUNDLE[fam] || []).includes(c.id);

let state = { job: PLANS[0].jobCode, track: null, open: new Set(), type: 'all', scope: 'all', fam: 'all', q: '', stage: 'all' };
try { const s = JSON.parse(localStorage.getItem('plan-lib') || '{}'); if (s.job && PLAN[s.job]) state.job = s.job; } catch (e) {}
const save = () => { try { localStorage.setItem('plan-lib', JSON.stringify({ job: state.job })); } catch (e) {} };

// ── 상단 통계 ──
const localCount = PLANS.reduce((s, p) => s + p.projects.length, 0);
const branches = PLANS.reduce((s, p) => s + Math.max(1, p.tracks.length), 0);
const jobCount = PLANS.reduce((s, p) => s + 1 + PRI[p.jobCode].covers.length, 0);
document.getElementById('stats').innerHTML =
  `<span>계획 <b>${PLANS.length}</b></span><span>덮는 직업 <b>${jobCount}</b></span><span>세부 카테고리까지 <b>${branches}</b>갈래</span><span>보편 프로젝트 <b>${D.common.length}</b></span><span>직업 전용 <b>${localCount}</b></span>`;

// ── 직업 목록 ──
function renderStageBar() {
  const n = s => s === 'all' ? PLANS.length : PLANS.filter(p => stageOf(PRI[p.jobCode]) === s).length;
  document.getElementById('stage-bar').innerHTML = STAGES.map(([v, name]) => `<button class="fbtn" data-stage="${v}" aria-pressed="${state.stage === v}">${name}<small>${n(v)}</small></button>`).join('');
}
document.getElementById('stage-bar').addEventListener('click', e => {
  const b = e.target.closest('.fbtn'); if (!b) return;
  state.stage = b.dataset.stage; renderStageBar(); renderJobList();
});
function renderJobList() {
  const q = state.q.trim();
  const byFam = {};
  for (const p of PLANS) {
    const pr = PRI[p.jobCode];
    if (state.stage !== 'all' && stageOf(pr) !== state.stage) continue;
    // 대표 이름에 없으면 함께 덮는 직업 이름에서 찾는다(찾은 이름은 목록에 보여 준다)
    const own = !q || (p.displayName + p.title).includes(q);
    const hit = own ? null : pr.covers.find(c => c.title.includes(q));
    if (!own && !hit) continue;
    (byFam[p.family] ||= []).push({ p, pr, hit });
  }
  const order = Object.keys(FAM).filter(f => byFam[f]);
  document.getElementById('job-list').innerHTML = order.length ? order.map(f => `
    <div class="fam">${esc(FAM[f])} · ${byFam[f].length}</div>
    ${byFam[f].map(({ p, pr, hit }) => `
      <button class="jobbtn" data-job="${p.jobCode}" aria-current="${p.jobCode === state.job}">
        <span class="jobbtn__name">${esc(p.displayName)}</span>${pr.tier != null ? `<span class="tier tier--${pr.tier}">T${pr.tier}</span>` : `<span class="tier">${pr.wave}단계</span>`}
        <span class="jobbtn__meta">${hit ? `'${esc(hit.title)}' 포함 · ` : ''}${p.tracks.length ? `카테고리 ${p.tracks.length} · ` : ''}${p.gate ? '관문 있음 · ' : ''}${esc(pr.groupName)}</span>
      </button>`).join('')}`).join('') : `<div class="empty">${q ? `'${esc(q)}' 에 맞는 직업이 없어요` : '이 단계에는 직업이 없어요'}</div>`;
}
document.getElementById('job-list').addEventListener('click', e => {
  const b = e.target.closest('.jobbtn'); if (!b) return;
  selectJob(b.dataset.job);
});
document.getElementById('job-search').addEventListener('input', e => { state.q = e.target.value; renderJobList(); });

function selectJob(code) {
  state.job = code; state.track = null; state.open = new Set(); save();
  if (state.stage !== 'all' && stageOf(PRI[code]) !== state.stage) { state.stage = 'all'; renderStageBar(); }
  renderJobList(); renderJob();
  document.getElementById('job-detail').scrollIntoView({ block: 'start', behavior: 'auto' });
  window.scrollTo({ top: 0 });
}

// ── 직업 상세 ──
function itemsFor(plan, track) {
  const extra = track ? plan.byTrack[track] : [];
  return [...plan.common.map(i => ({ ...i, _track: null })), ...extra.map(i => ({ ...i, _track: track }))].sort((a, b) => a.step - b.step);
}
function projOf(plan, ref) { return ref.startsWith('cp.') ? CP[ref] : plan.projects.find(p => p.id === ref); }

function renderJob() {
  const p = PLAN[state.job], pr = PRI[p.jobCode];
  if (!state.track && p.tracks.length) state.track = p.tracks[0].id;
  const items = itemsFor(p, state.track);
  const must = items.filter(i => !i.optional);
  const sumW = list => list.reduce((s, i) => s + weeksOf(projOf(p, i.ref)), 0);
  const major = must.filter(i => i.major !== false);
  const commonN = items.filter(i => i.ref.startsWith('cp.')).length;
  const trk = p.tracks.find(t => t.id === state.track);
  const cats = [...new Set(items.map(i => projOf(p, i.ref).category))];

  document.getElementById('job-detail').innerHTML = `
    <div class="head">
      <div class="head__title"><h2>${esc(p.displayName)}</h2><span class="head__official">${esc(p.title)}</span><span class="mono">${p.jobCode}</span></div>
      <div class="chips">
        <span class="chip">${pr.tier != null ? `1차 우선순위 ${pr.no}위 · 티어 ${pr.tier}` : `2차 ${pr.wave}단계 · 묶음 ${esc(pr.batch)}`}</span><span class="chip">${esc(FAM[p.family])}</span><span class="chip">추천 직무: ${esc(pr.groupName)}</span>
        ${pr.work24Postings != null ? `<span class="chip">고용24 공고 ${pr.work24Postings}건(10/20 수집)</span>` : ''}
      </div>
      <p>${esc(p.summary)}</p>
      ${p.gate ? `<div class="gate"><b>진입 관문</b><span>${esc(p.gate)}</span></div>` : ''}
      ${p.verify ? `<div class="verify"><b>확인 필요</b><span>${esc(p.verify)}</span></div>` : ''}
      ${pr.covers.length ? `<div class="covers">같은 계획을 함께 쓰는 직업: ${pr.covers.map(c => `${esc(c.title)}${c.track ? ` → ${esc(p.tracks.find(t => t.id === c.track)?.name)}` : ''}`).join(', ')}</div>` : ''}
    </div>
    ${p.tracks.length ? `
      <div class="trackbar" role="group" aria-label="세부 카테고리">${p.tracks.map(t => `<button data-track="${t.id}" aria-pressed="${t.id === state.track}">${esc(t.name)}</button>`).join('')}</div>
      <div class="trackdesc">${esc(trk?.desc)}</div>` : ''}
    <div class="summary">
      <div class="sum"><div class="sum__label">비전공자 기준</div><div class="sum__val">${must.length}개 · ${fmtWeeks(sumW(must))}</div></div>
      <div class="sum"><div class="sum__label">관련 전공자 기준</div><div class="sum__val">${major.length}개 · ${fmtWeeks(sumW(major))}</div></div>
      <div class="sum"><div class="sum__label">구성</div><div class="sum__val">보편 ${commonN} · 전용 ${items.length - commonN}${items.length - must.length ? ` <small>+ 선택 ${items.length - must.length}</small>` : ''}</div></div>
    </div>
    <div class="legend">${cats.map(c => `<span><i class="dot" style="background:var(--c-${c})"></i>${CAT[c]}</span>`).join('')}<span>주 수는 하나씩 차례로 할 때의 합 — 실제 기간은 앱의 '속도 고르기'가 정한다</span></div>
    <ol class="steps">${items.map((it, n) => stepHtml(p, it, n)).join('')}</ol>`;
}

function stepHtml(plan, it, n) {
  const pj = projOf(plan, it.ref);
  const isCommon = it.ref.startsWith('cp.');
  const key = `${it.ref}@${it.step}`;
  const open = state.open.has(key);
  const w = weeksOf(pj);
  return `<li class="step${it.optional ? ' step--opt' : ''}">
    <button class="step__head" data-key="${esc(key)}" aria-expanded="${open}">
      <span class="step__no">${String(n + 1).padStart(2, '0')}</span>
      <span class="step__main">
        <span class="step__name">${esc(pj.name)}</span>
        <span class="step__tags">
          <span class="tag tag--cat" style="background:var(--c-${pj.category})">${CAT[pj.category]}</span>
          <span class="tag ${isCommon ? 'tag--common' : 'tag--local'}">${isCommon ? '보편' : '직업 전용'}</span>
          ${it._track ? `<span class="tag tag--track">${esc(plan.tracks.find(t => t.id === it._track).name)}</span>` : ''}
          ${it.optional ? '<span class="tag tag--opt">선택</span>' : ''}
          ${it.major === false ? '<span class="tag tag--skip">전공자 생략</span>' : ''}
          <span class="tag tag--opt">${esc(pj.level)}</span>
        </span>
        <span class="step__goal">${esc(pj.goal)}</span>
        ${it.note ? `<span class="step__note">${esc(it.note)}</span>` : ''}
        ${it.major === false ? `<span class="step__note"><em>전공자 생략 이유 · </em>${esc(it.skip)}</span>` : ''}
      </span>
      <span class="step__weeks"><b>${w}주</b><small>주 ${pj.daysPerWeek}회 · ${pj.minutesPerSession}분</small></span>
    </button>
    ${open ? `<div class="step__body">
      <div class="meta"><span>진행 방식 <b>${esc(METHOD[pj.method] || pj.method)}</b></span><span>유형 <b>${esc(TYPES[pj.type]?.name)} · ${esc(TYPES[pj.type]?.subtypes[pj.subtype])}</b></span>
        ${isCommon ? `<span>${pj.scope === 'all' ? esc(SCOPE.all) : `${esc(SCOPE.family)} (${esc(famLabel(pj, plan.family))})`}</span><button class="jumplink" data-cp="${pj.id}">보편 프로젝트에서 보기</button>` : ''}
        <span class="mono">${esc(pj.id)}</span></div>
      <div class="phases">${pj.phases.map(ph => `<div class="phase"><div class="phase__t">${esc(ph.title)}<span>${ph.weeks}주</span></div><ul>${ph.items.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`).join('')}</div>
      ${pj.options ? `<ul class="options">${pj.options.map(o => `<li>${esc(o)}</li>`).join('')}</ul>` : ''}
      ${pj.verify ? `<div class="verify"><b>확인 필요</b><span>${esc(pj.verify)}</span></div>` : ''}
    </div>` : ''}
  </li>`;
}

document.getElementById('job-detail').addEventListener('click', e => {
  const t = e.target.closest('[data-track]');
  if (t) { state.track = t.dataset.track; state.open = new Set(); renderJob(); return; }
  const j = e.target.closest('.jumplink');
  if (j) { e.stopPropagation(); goCommon(j.dataset.cp); return; }
  const h = e.target.closest('.step__head');
  if (h) { const k = h.dataset.key; state.open.has(k) ? state.open.delete(k) : state.open.add(k); renderJob(); }
});

// ── 보편 프로젝트 ──
function count(fn) { return D.common.filter(fn).length; }
function renderFilters() {
  const row = (label, key, opts) => `<div class="filters__row"><span class="filters__label">${label}</span>${opts.map(([v, name, n]) => `<button class="fbtn" data-f="${key}" data-v="${v}" aria-pressed="${state[key] === v}">${esc(name)}<small>${n}</small></button>`).join('')}</div>`;
  document.getElementById('filters').innerHTML = `
    <input id="cp-search" class="search" type="search" placeholder="이름으로 찾기" value="${esc(state.cq || '')}" aria-label="보편 프로젝트 찾기">
    ${row('활동 유형', 'type', [['all', '전체', D.common.length], ...D.taxonomy.types.map(t => [t.id, `${t.no}. ${t.name}`, count(c => c.type === t.id)])])}
    ${row('공통성', 'scope', [['all', '전체', D.common.length], ['all-scope', SCOPE.all, count(c => c.scope === 'all')], ['family', SCOPE.family, count(c => c.scope === 'family')]])}
    ${row('계열', 'fam', [['all', '전체', D.common.length], ...Object.entries(FAM).map(([k, v]) => [k, v, count(c => inFam(c, k))]).filter(x => x[2])])}
    ${state.fam !== 'all' && BUNDLE[state.fam] ? `<div class="filters__row"><span class="filters__label">기본 조합</span>${BUNDLE[state.fam].map(id => `<button class="fbtn" data-cp="${id}">${esc(CP[id].name)}</button>`).join('')}</div>
      <div class="step__note">${esc(FAM[state.fam])} 계열에서 먼저 권하는 묶음이다. 아래 카드는 이 계열의 계획이 많이 쓰는 순서 — 전 직무 공통 가운데 이 계열이 쓰는 것도 함께 나온다.</div>` : ''}`;
  document.getElementById('cp-search').addEventListener('input', e => { state.cq = e.target.value; renderCards(); });
}
document.getElementById('filters').addEventListener('click', e => {
  const b = e.target.closest('.fbtn'); if (!b) return;
  if (b.dataset.cp) {  // 기본 조합의 항목 → 그 카드를 펼쳐 보여 준다(계열은 그대로 두고 다른 조건만 푼다)
    const id = b.dataset.cp;
    state.type = 'all'; state.scope = 'all'; state.cq = ''; state.open.add(id); renderFilters(); renderCards();
    setTimeout(() => document.getElementById('card-' + id.replace('.', '-'))?.scrollIntoView({ block: 'center' }), 30);
    return;
  }
  state[b.dataset.f] = b.dataset.v; renderFilters(); renderCards();
});
function renderCards() {
  const q = (state.cq || '').trim();
  const list = D.common.filter(c =>
    (state.type === 'all' || c.type === state.type) &&
    (state.scope === 'all' || (state.scope === 'all-scope' ? c.scope === 'all' : c.scope === state.scope)) &&
    (state.fam === 'all' || inFam(c, state.fam)) &&
    (!q || c.name.includes(q))
  );
  const famN = c => state.fam === 'all' ? 0 : (USEDF[c.id]?.[state.fam] || 0);
  list.sort((a, b) => (famN(b) - famN(a)) || ((USED[b.id]?.length || 0) - (USED[a.id]?.length || 0)));
  document.getElementById('cards').innerHTML = list.length ? list.map(c => {
    const used = USED[c.id] || [];
    const open = state.open.has(c.id);
    return `<article class="card" id="card-${c.id.replace('.', '-')}">
      <button class="card__head" data-cp="${c.id}" aria-expanded="${open}">
        <span class="card__top"><span class="card__name">${esc(c.name)}</span><span class="card__use">${state.fam === 'all' ? `<b>${used.length}</b>개 계획` : `이 계열 <b>${famN(c)}</b> · 전체 ${used.length}`}</span></span>
        <span class="step__tags">
          <span class="tag tag--cat" style="background:var(--c-${c.category})">${CAT[c.category]}</span>
          <span class="tag tag--opt">${esc(TYPES[c.type].name)} · ${esc(TYPES[c.type].subtypes[c.subtype])}</span>
          <span class="tag ${c.scope === 'all' ? 'tag--track' : 'tag--common'}">${esc(famLabel(c, state.fam))}</span>
        </span>
        <span class="card__goal">${esc(c.goal)}</span>
        <span class="meta"><span><b>${weeksOf(c)}주</b> · 주 ${c.daysPerWeek}회 · ${c.minutesPerSession}분</span><span>${esc(METHOD[c.method] || c.method)}</span><span>${esc(c.level)}</span></span>
      </button>
      ${open ? `<div class="card__body">
        <div class="phases">${c.phases.map(ph => `<div class="phase"><div class="phase__t">${esc(ph.title)}<span>${ph.weeks}주</span></div><ul>${ph.items.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`).join('')}</div>
        ${c.options ? `<ul class="options">${c.options.map(o => `<li>${esc(o)}</li>`).join('')}</ul>` : ''}
        ${c.verify ? `<div class="verify"><b>확인 필요</b><span>${esc(c.verify)}</span></div>` : ''}
        <p class="sec-title">쓰는 계획 ${used.length}개</p>
        <div class="usedby">${used.length ? used.map(j => `<button data-job="${j}">${esc(PLAN[j].displayName)}</button>`).join('') : '<span class="step__note">아직 어느 계획에도 없다 — 사용자가 골라 쓰는 용도</span>'}</div>
        ${c.scope === 'family' ? `<div class="step__note"><em>쓰는 계열 ${c.families.length}곳 · </em>${c.families.map(f => esc(FAM[f])).join(', ')}</div>` : ''}
        <div class="meta"><span class="mono">${c.id}</span>${c.promotedFrom ? `<span>직업 계획에서 올라옴: ${esc(PLAN[c.promotedFrom.split(':')[0]]?.displayName)}</span>` : ''}</div>
      </div>` : ''}
    </article>`;
  }).join('') : '<div class="empty">조건에 맞는 보편 프로젝트가 없어요</div>';
}
document.getElementById('cards').addEventListener('click', e => {
  const j = e.target.closest('.usedby button');
  if (j) { location.hash = 'jobs'; selectJob(j.dataset.job); return; }
  const h = e.target.closest('.card__head');
  if (h) { const k = h.dataset.cp; state.open.has(k) ? state.open.delete(k) : state.open.add(k); renderCards(); }
});
function goCommon(id) {
  state.type = 'all'; state.scope = 'all'; state.fam = 'all'; state.cq = ''; state.open = new Set([id]);
  location.hash = 'common';
  setTimeout(() => document.getElementById('card-' + id.replace('.', '-'))?.scrollIntoView({ block: 'center' }), 30);
}

// ── 보기 전환 ──
function route() {
  const v = location.hash === '#common' ? 'common' : 'jobs';
  document.getElementById('view-jobs').hidden = v !== 'jobs';
  document.getElementById('view-common').hidden = v !== 'common';
  document.getElementById('tab-jobs').setAttribute('aria-current', v === 'jobs' ? 'page' : 'false');
  document.getElementById('tab-common').setAttribute('aria-current', v === 'common' ? 'page' : 'false');
  if (v === 'jobs') { renderStageBar(); renderJobList(); renderJob(); } else { renderFilters(); renderCards(); }
}
window.addEventListener('hashchange', route);
route();
</script>
