name: Work24 직업정보 월간 갱신

# 고용24 공식 API 에서 직업정보를 전량 수집해 job_info 를 갱신한다.
#
# 월 1회인 이유: 원본이 **연 1회 조사** 데이터다(임금·전망 모두 "조사년도:2025년").
# 일·주 단위로 돌릴 이유가 없고, 한도가 공개돼 있지 않은 외부 API 를 자주 두드릴 이유도 없다.
#
# ⚠️ API 컨테이너와 무관하다. 여기서 Atlas 에 직접 붙는다.
#    그래서 WORK24_KEY 를 Lightsail env 에 넣지 않았다(deploy.yml 미수정).

on:
  schedule:
    # 매월 2일 03:00 KST (= 매월 1일 18:00 UTC). 트래픽이 가장 적은 시간대.
    # ⚠️ GitHub Actions cron 은 **표준 POSIX 만** 지원한다. `L`(말일) 같은 확장 문법을 쓰면
    #    워크플로 파싱 자체가 실패하고 `workflow_dispatch` 도 막힌다(422 Invalid cron).
    - cron: '0 18 1 * *'
  workflow_dispatch:
    inputs:
      skip_collect:
        description: '수집을 건너뛰고 이미 받아둔 work24_raw 로 적재만 수행'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # ⚠️ 동시 실행을 막는다. 두 잡이 같이 swap 하면 백업이 엉킨다.
  group: work24-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # 수집 ~26분 + 적재. 넉넉히.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: 수집 (480직업 × 7섹션)
        if: ${{ !inputs.skip_collect }}
        env:
          WORK24_KEY: ${{ secrets.WORK24_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        # --resume 은 이미 받은 jobCd 를 건너뛴다. 재실행 시 처음부터 다시 받지 않는다.
        # ⚠️ 다만 월간 갱신은 **새 값을 받아야** 하므로 resume 을 쓰지 않는다.
        #    중간 실패 시 수동으로 --resume 을 돌리면 된다.
        run: node scripts/work24-collect.js

      - name: 검증 (dry run)
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: node scripts/work24-load.js --dry

      - name: 적재 (swap)
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: node scripts/work24-load.js

      - name: 결과 요약
        if: always()
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: node scripts/work24-summary.js
