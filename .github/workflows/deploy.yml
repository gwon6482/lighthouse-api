name: Build & Deploy API

# main push → Docker 빌드 → ghcr.io 푸시 → AWS Lightsail 컨테이너 재배포
# (기존 SSH→홈서버 pm2 방식 폐기. 홈서버 의존 제거)

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write   # ghcr.io 푸시

env:
  IMAGE: ghcr.io/gwon6482/lighthouse-api
  AWS_REGION: ap-northeast-2
  LIGHTSAIL_SERVICE: lighthouse-api

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (sha + latest)
        run: |
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
          echo "pushed $IMAGE:${{ github.sha }}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to Lightsail
        env:
          IMAGE_REF: ${{ env.IMAGE }}:${{ github.sha }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # 카카오 로그인. 키가 없어도 배포는 성공해야 한다(기능만 꺼진 채 뜬다) → 아래에서 .get 사용
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
        run: |
          # 시크릿 노출 방지: python 으로 env 에서 직접 읽어 배포 스펙 작성
          python3 - <<'PY'
          import os, json
          spec = {
            "serviceName": os.environ["LIGHTSAIL_SERVICE"],
            "containers": {
              "app": {
                "image": os.environ["IMAGE_REF"],
                "environment": {
                  "NODE_ENV": "production",
                  "PORT": "8080",
                  "MONGODB_URI": os.environ["MONGODB_URI"],
                  "JWT_SECRET": os.environ["JWT_SECRET"],
                  "JWT_EXPIRES_IN": "7d",
                  # 관리자 API(/api/admin 및 job/reference 쓰기 등) 보호 공유키.
                  # GitHub Secret 미설정 시 여기서 KeyError→배포 실패(키 없이 배포돼 503 나는 것 방지).
                  "ADMIN_API_KEY": os.environ["ADMIN_API_KEY"],
                  # S3 인증사진 업로드(진로달성). 전용 버킷 lighthouse-uploads, uploads/* 공개읽기
                  "AWS_REGION": os.environ["AWS_REGION"],
                  "AWS_ACCESS_KEY_ID": os.environ["AWS_ACCESS_KEY_ID"],
                  "AWS_SECRET_ACCESS_KEY": os.environ["AWS_SECRET_ACCESS_KEY"],
                  "S3_UPLOAD_BUCKET": "lighthouse-uploads",
                  "S3_UPLOAD_PREFIX": "uploads",
                  "S3_UPLOAD_PUBLIC_BASE": "https://lighthouse-uploads.s3.ap-northeast-2.amazonaws.com",
                  # 카카오 로그인 — 비밀이 아닌 고정값은 여기에 평문으로 둔다.
                  # 시크릿에 넣으면 카카오 콘솔 등록값과 한 글자만 달라도 KOE006 이 나는데
                  # 값이 가려져 원인을 못 찾는다. 콘솔 등록값과 이 줄이 정확히 같아야 한다.
                  "KAKAO_REDIRECT_URI": "https://api.lighthouse.career/api/auth/kakao/callback",
                  # OAuth 복귀 허용 오리진(오픈 리다이렉트 차단 목록)
                  "OAUTH_ALLOWED_ORIGINS": "https://app.lighthouse.career,https://test.lighthouse.career",
                },
                "ports": {"8080": "HTTP"},
              }
            },
            "publicEndpoint": {
              "containerName": "app",
              "containerPort": 8080,
              "healthCheck": {
                "path": "/api/health",
                "successCodes": "200-499",
                "intervalSeconds": 10,
                "timeoutSeconds": 5,
                "healthyThreshold": 2,
                "unhealthyThreshold": 5,
              },
            },
          }
          # 카카오 앱 키는 **선택**이다. 미등록이면 항목을 아예 빼고, 서버는 기능만 꺼진 채 뜬다
          # (/api/auth/providers → kakao:false, /api/auth/kakao → 503).
          # ⚠️ ADMIN_API_KEY 처럼 os.environ[] 로 읽으면 안 된다 — 키를 넣기 전까지 배포 전체가 죽는다.
          for k in ("KAKAO_REST_API_KEY", "KAKAO_CLIENT_SECRET"):
              v = os.environ.get(k, "").strip()
              if v:
                  spec["containers"]["app"]["environment"][k] = v
          with open("deploy.json", "w") as f:
              json.dump(spec, f)
          PY
          aws lightsail create-container-service-deployment \
            --cli-input-json file://deploy.json \
            --region "$AWS_REGION"
          rm -f deploy.json
          echo "Lightsail deployment 트리거됨: $IMAGE_REF"
